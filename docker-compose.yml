services:
  gymfish_nginx:
    container_name: gymfish_nginx
    build:
      context: .
      dockerfile: Dockerfile.nginx
    networks:
      - gymfish_net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gymfish_api
    ports:
      - "1717:80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  gymfish_api:
    container_name: gymfish_api
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - gymfish_net
    environment:
      GIN_MODE: release # release mode
    restart: always

networks:
  gymfish_net:
    driver: bridge
